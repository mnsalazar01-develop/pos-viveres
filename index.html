<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>📦 POS Premium - Catálogo</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #1e1e1e; color: #ffffff; padding: 15px; margin: 0; }
        .formulario { width: 100%; max-width: 750px; margin: 0 auto; background: #2d2d2d; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; margin-bottom: 5px; color: #ffffff; font-size: 18px; }
        .fila { display: flex; gap: 12px; margin-bottom: 10px; }
        .campo { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #b3b3b3; }
        input, select { padding: 8px; font-size: 14px; border: 1px solid #444; border-radius: 5px; background-color: #1e1e1e; color: #ffffff; outline: none; }
        input:focus, select:focus { border-color: #ff4b4b; }
        button { width: 100%; padding: 10px; background-color: #ff4b4b; color: white; border: none; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #e04343; }
        .mensaje { padding: 8px; border-radius: 5px; margin-top: 8px; font-size: 13px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="formulario">
        <h3>📦 Administración de Productos</h3>
        <p style="color: #b3b3b3; font-size: 11px; margin-top:-5px; margin-bottom: 12px;">Motor Asíncrono Unificado v1.3.0</p>
        
        <div class="fila">
            <div class="campo">
                <label>Nombre del Producto*</label>
                <input type="text" id="w_nombre" list="sug_nombres" onfocus="this.click();" placeholder="Escribe o busca el nombre...">
                <datalist id="sug_nombres"></datalist>
            </div>
            <div class="campo">
                <label>Marca del Producto</label>
                <input type="text" id="w_marca" list="sug_marcas" onfocus="this.click();" placeholder="Escribe o busca la marca...">
                <datalist id="sug_marcas"></datalist>
            </div>
        </div>
        
        <div class="fila">
            <div class="campo">
                <label>Tamaño / Peso</label>
                <input type="number" id="w_tamano" placeholder="Ej: 500, 1, 250">
            </div>
            <div class="campo">
                <label>Unidad de Medida</label>
                <select id="w_unidad">
                    <option value="gr">gr</option>
                    <option value="kg">kg</option>
                    <option value="ml">ml</option>
                    <option value="lt">lt</option>
                    <option value="unidad">unidad</option>
                </select>
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label>Categoría Principal</label>
                <select id="w_categoria" onchange="actualizarSubcategoriasCascada()">
                    <option value="">--- Seleccionar ---</option>
                </select>
            </div>
            <div class="campo">
                <label>Subcategoría (Reactiva)</label>
                <select id="w_subcategoria">
                    <option value="">--- Seleccionar ---</option>
                </select>
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label>Código de Barras (SKU)</label>
                <input type="text" id="w_barras" placeholder="Escanea o escribe el código...">
            </div>
            <div class="campo" style="flex:0; min-width:150px; justify-content: flex-end;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:12px; padding-bottom:10px;">
                    <input type="checkbox" id="w_forzar" style="accent-color:#ff4b4b;"> ⚠️ Forzar registro
                </label>
            </div>
        </div>

        <button id="btn_guardar" onclick="guardarProductoPOS()">🚀 Guardar Producto en Catálogo</button>
        <div id="panel_mensaje" class="mensaje"></div>
    </div>

    <script>
        // =========================================================================
        // COLOCA TUS CREDENCIALES REALES AQUÍ ADENTRO UNA SOLA VEZ
        // =========================================================================

        const SUPABASE_URL = "https://pmhusucbjptpsahrxird.supabase.co"
        const SUPABASE_KEY = "sb_publishable_KX7Ap3Led8LZbIeQwHEhxQ_QNIWtru_"

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriasMaestras = [];
        let subcategoriasMaestras = [];
        let productosMaestros = [];

        async function conectarYAlimentarPantalla() {
            try {
                const { data: prods } = await _supabase.from('productos').select('nombre, marca').order('nombre').limit(100);
                productosMaestros = prods || [];

                const { data: cats } = await _supabase.from('categorias').select('*').order('id_cat');
                const { data: subcats } = await _supabase.from('subcategorias').select('*').order('nombre');
                
                categoriasMaestras = cats || [];
                subcategoriasMaestras = subcats || [];

                // Renderizado de Nombres (Saneado v1.3.0)
                const dl_n = document.getElementById('sug_nombres');
                dl_n.innerHTML = "";
                const nombresUnicos = [...new Set(productosMaestros.map(p => p.nombre).filter(n => n))].sort();
                nombresUnicos.forEach(n => {
                    let opt = document.createElement('option'); opt.value = n; dl_n.appendChild(opt);
                });

                // Renderizado de Marcas
                const dl_m = document.getElementById('sug_marcas');
                dl_m.innerHTML = "";
                const marcasUnicas = [...new Set(productosMaestros.map(p => p.marca).filter(m => m))].sort();
                marcasUnicas.forEach(m => {
                    let opt = document.createElement('option'); opt.value = m; dl_m.appendChild(opt);
                });

                // Renderizado de Categorías
                const sel_c = document.getElementById('w_categoria');
                sel_c.innerHTML = '<option value="">--- Seleccionar ---</option>';
                categoriasMaestras.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c.id_cat;
                    opt.textContent = c.nombre;
                    sel_c.appendChild(opt);
                });

            } catch (error) {
                mostrarMensaje("🚨 Error de conexión: Revisa tus credenciales dentro del script.", "#e04343");
            }
        }

        function actualizarSubcategoriasCascada() {
            const idCatSel = document.getElementById('w_categoria').value;
            const sel_s = document.getElementById('w_subcategoria');
            sel_s.innerHTML = '<option value="">--- Seleccionar ---</option>';
            
            if (idCatSel) {
                const filtradas = subcategoriasMaestras.filter(sc => sc.id_cat == idCatSel);
                filtradas.forEach(sc => {
                    let opt = document.createElement('option');
                    opt.value = sc.id_subcat;
                    opt.textContent = sc.nombre;
                    sel_s.appendChild(opt);
                });
            }
        }

        async function guardarProductoPOS() {
            const nom = document.getElementById('w_nombre').value.trim();
            const mar = document.getElementById('w_marca').value.trim();
            const tam = document.getElementById('w_tamano').value;
            const uni = document.getElementById('w_unidad').value;
            const cat = document.getElementById('w_categoria').value;
            const sub = document.getElementById('w_subcategoria').value;
            const bar = document.getElementById('w_barras').value.trim();
            const forzar = document.getElementById('w_forzar').checked;

            if (!nom) { mostrarMensaje("⚠️ El campo Nombre es obligatorio.", "#e6a23c"); return; }

            if (!forzar && productosMaestros.length > 0) {
                const clon = productosMaestros.find(p => 
                    p.nombre.toLowerCase().replace(/\s+/g, '') === nom.toLowerCase().replace(/\s+/g, '') &&
                    (p.marca || '').toLowerCase().replace(/\s+/g, '') === mar.toLowerCase().replace(/\s+/g, '')
                );
                if (clon) { mostrarMensaje(`🚨 CLON DETECTADO: Ya existe '${nom}' con marca '${mar}'.`, "#e04343"); return; }
            }

            const paquete = {
                nombre: nom,
                marca: mar ? mar : null,
                tamano: tam ? parseFloat(tam) : null,
                unidad: uni,
                id_cat: cat ? parseInt(cat) : null,
                id_subcat: sub ? parseInt(sub) : null,
                codigo_barras: bar ? bar : null
            };

            const { error } = await _supabase.from('productos').insert([paquete]);

            if (error) {
                mostrarMensaje(`🚨 Error en Supabase: ${error.message}`, "#e04343");
            } else {
                mostrarMensaje("🎉 ¡Producto registrado exitosamente!", "#2bc443");
                document.getElementById('w_nombre').value = "";
                document.getElementById('w_marca').value = "";
                document.getElementById('w_tamano').value = "";
                document.getElementById('w_categoria').value = "";
                document.getElementById('w_subcategoria').innerHTML = '<option value="">--- Seleccionar ---</option>';
                document.getElementById('w_barras').value = "";
                document.getElementById('w_forzar').checked = false;
                
                conectarYAlimentarPantalla();
            }
        }

        function mostrarMensaje(texto, color) {
            const panel = document.getElementById('panel_mensaje');
            panel.innerText = texto;
            panel.style.backgroundColor = color;
            panel.style.display = "block";
            if (color === "#2bc443") { setTimeout(() => { panel.style.display = "none"; }, 4000); }
        }

        window.onload = conectarYAlimentarPantalla;
    </script>
</body>
</html>
